        <!-- Security hardening: disable console + right-click in production -->
        <script>
            (function () {
                // Allow dev mode bypass: set window.__devMode = true before load
                if (window.__devMode) return;

                // --- Disable context menu (right-click) ---
                document.addEventListener(
                    "contextmenu",
                    function (e) {
                        e.preventDefault();
                        return false;
                    },
                    true
                );

                // --- Block DevTools keyboard shortcuts ---
                document.addEventListener(
                    "keydown",
                    function (e) {
                        // F12
                        if (e.key === "F12") {
                            e.preventDefault();
                            return false;
                        }
                        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+U, Ctrl+Shift+C
                        if (e.ctrlKey && e.shiftKey && ["I", "J", "U", "C"].includes(e.key.toUpperCase())) {
                            e.preventDefault();
                            return false;
                        }
                        // Cmd+Option+I / Cmd+Option+J (macOS)
                        if (e.metaKey && e.altKey && ["I", "J"].includes(e.key.toUpperCase())) {
                            e.preventDefault();
                            return false;
                        }
                    },
                    true
                );

                // --- Silence all console methods ---
                var noop = function () {};
                var methods = [
                    "log",
                    "debug",
                    "info",
                    "warn",
                    "error",
                    "dir",
                    "table",
                    "trace",
                    "group",
                    "groupEnd",
                    "groupCollapsed",
                    "time",
                    "timeEnd",
                    "count",
                    "clear",
                ];
                methods.forEach(function (m) {
                    try {
                        console[m] = noop;
                    } catch (_) {}
                });
                try {
                    Object.defineProperty(window, "console", {
                        get: function () {
                            return {
                                log: noop,
                                debug: noop,
                                info: noop,
                                warn: noop,
                                error: noop,
                                dir: noop,

                        },

                    });
                } catch (_) {}
            })();
        </script>

        <!-- Browser Service Worker Prevention -->
        <script>
            // Disabled domain check to allow Quantum Bot branding and features
            // Check browser compatibility and prevent service worker issues
            const userAgent = navigator.userAgent.toLowerCase();
            const isFirefox = userAgent.includes("firefox");
            const isSafari = userAgent.includes("safari") && !userAgent.includes("chrome");
            const shouldSkipSW = isFirefox || isSafari;

            if (shouldSkipSW) {
                // Cleanup any existing service workers
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then((registrations) => {
                            registrations.forEach((registration) => {
                                registration.unregister();
                            });
                        })
                        .catch(() => {});
                }
            }

            // Listen for service worker messages if registered by PWA utils (non-problematic browsers only)
            if ("serviceWorker" in navigator && !shouldSkipSW) {
                navigator.serviceWorker.addEventListener("message", () => {});
